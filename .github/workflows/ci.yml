name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Zig
      uses: mlugg/setup-zig@v2
    - name: Check formatting
      run: zig fmt --check .
  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Zig
      uses: mlugg/setup-zig@v2
    - name: Install packages
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: libx11-dev libxrandr-dev libxcursor-dev libglvnd-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libvulkan-dev libxext-dev libudev-dev libpulse-dev
    - name: Build (native)
      uses: $/.github/actions/build
      with:
        target: native
        args: -fsys=wio
    - name: Build (x86-windows)
      uses: $/.github/actions/build
      with:
        target: x86-windows
    - name: Build (aarch64-windows)
      uses: $/.github/actions/build
      with:
        target: aarch64-windows
    - name: Build (arm-linux-gnueabi)
      uses: $/.github/actions/build
      with:
        target: arm-linux-gnueabi
    - name: Build (powerpc64-openbsd)
      uses: $/.github/actions/build
      with:
        target: powerpc64-openbsd
    - name: Build (mips-netbsd)
      uses: $/.github/actions/build
      with:
        target: mips-netbsd
    - name: Build (riscv64-freebsd)
      uses: $/.github/actions/build
      with:
        target: riscv64-freebsd
    - name: Build (wasm32-freestanding)
      uses: $/.github/actions/build
      with:
        target: wasm32-freestanding
        args: -Dcpu=bleeding_edge
  build_macos:
    needs: check
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Zig
      uses: mlugg/setup-zig@v2
    - name: Build (native)
      uses: $/.github/actions/build
      with:
        target: native
    - name: Build (x86_64-macos)
      uses: $/.github/actions/build
      with:
        target: x86_64-macos
        args: -Dmacos_sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
